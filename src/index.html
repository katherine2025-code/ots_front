<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>OTS - Sistema de Predicción Hotelera</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/png" href="assets/icon/favicon.png">
  <!-- La app es siempre clara (todos sus colores están fijados en claro). Aun así se declara
       "light dark": Chrome NO aplica su modo oscuro forzado a páginas que dicen soportar oscuro,
       y "light" u "only light" sí lo dejan invertir los colores (probado). Ningún estilo debe
       poner color-scheme: light, porque reactiva ese oscurecimiento en ese bloque.
       darkreader-lock hace lo mismo con la extensión Dark Reader. -->
  <meta name="color-scheme" content="light dark">
  <meta name="darkreader-lock">
</head>
<body>
  <app-root></app-root>
</body>
</html>
