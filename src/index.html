<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>OTS - Sistema de Predicción Hotelera</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/png" href="assets/icon/favicon.png">
  <!-- La app es siempre clara (todos sus colores están fijados en claro). Aun así se declara
       "light dark": Chrome NO aplica su modo oscuro forzado a páginas que dicen soportar oscuro,
       y "light" u "only light" sí lo dejan invertir los colores (probado). Ningún estilo debe
       poner color-scheme: light, porque reactiva ese oscurecimiento en ese bloque.
       darkreader-lock hace lo mismo con la extensión Dark Reader. -->
  <meta name="color-scheme" content="light dark">
  <meta name="darkreader-lock">

  <!-- PWA: permite "Instalar la aplicación" desde el navegador (como SGA/UPSE). -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2A6F97">
  <link rel="apple-touch-icon" href="assets/icon/pwa-192.png">

  <script>
    // Guarda el evento de instalación lo antes posible (puede dispararse antes
    // de que Angular cargue el login) y avisa a la app que ya se puede instalar.
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__deferredInstallPrompt = e;
      window.dispatchEvent(new Event('pwa-installable'));
    });
    window.addEventListener('appinstalled', function () {
      window.__deferredInstallPrompt = null;
      window.dispatchEvent(new Event('pwa-installed'));
    });

    // Registra el service worker (requisito para que el navegador ofrezca instalar).
    // Solo en la web: dentro del APK (Capacitor) no aplica y no debe tocar la webview nativa.
    (function () {
      var esNativo = !!(window.Capacitor && typeof window.Capacitor.isNativePlatform === 'function' && window.Capacitor.isNativePlatform());
      if (!esNativo && 'serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('sw.js').catch(function (err) {
            console.warn('No se pudo registrar el service worker:', err);
          });
        });
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
