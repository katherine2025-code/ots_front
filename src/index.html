<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>OTS - Sistema de Predicción Hotelera</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/png" href="assets/icon/favicon.png">
  <!-- Aplica el tema guardado antes de que cargue Angular (evita el destello claro/oscuro) -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('ots_tema');
        var oscuro = t ? t === 'oscuro' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (oscuro) { document.documentElement.classList.add('ion-palette-dark'); document.documentElement.style.colorScheme = 'dark'; }
      } catch (e) { }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
