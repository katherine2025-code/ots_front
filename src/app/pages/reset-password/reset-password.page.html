<ion-content class="login-content" scrollY="true">
  <div class="login-wrapper">
    <div class="login-container">
      <div class="logo-section">
        <img src="assets/icon/logo-ots.png" alt="Logo OTS - UPSE" class="logo-image">
        <p class="subtitle">Nueva contraseña</p>
      </div>

      <!-- Estado: formulario para fijar la nueva contraseña -->
      <form *ngIf="!exito" [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form">
        <p style="color:#4a5568;font-size:14px;margin:0 0 18px 0;text-align:center">
          Escribe tu nueva contraseña. Debe tener al menos 6 caracteres.
        </p>

        <div class="input-wrapper">
          <label class="input-label">
            <ion-icon name="lock-closed-outline"></ion-icon>
            Nueva contraseña
          </label>
          <div class="input-field">
            <ion-icon name="lock-closed-outline" class="field-icon"></ion-icon>
            <input
              formControlName="password"
              type="password"
              placeholder="Nueva contraseña"
              class="custom-input"
              autocomplete="new-password">
          </div>
          <div *ngIf="f['password'].invalid && f['password'].touched" class="error-message-small">
            <span *ngIf="f['password'].errors?.['required']">La contraseña es requerida</span>
            <span *ngIf="f['password'].errors?.['minlength']">Mínimo 6 caracteres</span>
          </div>
        </div>

        <div class="input-wrapper">
          <label class="input-label">
            <ion-icon name="lock-closed-outline"></ion-icon>
            Confirmar contraseña
          </label>
          <div class="input-field">
            <ion-icon name="lock-closed-outline" class="field-icon"></ion-icon>
            <input
              formControlName="confirmar"
              type="password"
              placeholder="Repite la contraseña"
              class="custom-input"
              autocomplete="new-password">
          </div>
          <div *ngIf="f['confirmar'].invalid && f['confirmar'].touched" class="error-message-small">
            <span *ngIf="f['confirmar'].errors?.['required']">Confirma la contraseña</span>
          </div>
        </div>

        <button type="submit" [disabled]="loading || form.invalid" class="login-button">
          <span *ngIf="loading" class="spinner"></span>
          <span *ngIf="!loading">
            <ion-icon name="checkmark-outline" class="btn-icon"></ion-icon>
            Restablecer contraseña
          </span>
        </button>

        <div *ngIf="error" class="error-alert">
          <ion-icon name="alert-circle-outline"></ion-icon>
          {{ error }}
        </div>

        <div class="register-section">
          <button type="button" class="register-button" (click)="volverLogin()">
            Volver a iniciar sesión
          </button>
        </div>
      </form>

      <!-- Estado: contraseña restablecida -->
      <div *ngIf="exito" class="login-form" style="text-align:center">
        <ion-icon name="checkmark-circle-outline" style="font-size:56px;color:#2e9e5b"></ion-icon>
        <h3 style="color:#1a5276;margin:12px 0 8px 0">¡Listo!</h3>
        <p style="color:#4a5568;font-size:14px;margin:0 0 20px 0">
          Tu contraseña fue restablecida correctamente. Ya puedes iniciar sesión.
        </p>
        <button type="button" class="login-button" (click)="volverLogin()">
          <ion-icon name="log-in-outline" class="btn-icon"></ion-icon>
          Iniciar sesión
        </button>
      </div>

      <div class="footer-text">
        <p>© 2026 OTS - UPSE - Todos los derechos reservados</p>
      </div>
    </div>
  </div>
</ion-content>
