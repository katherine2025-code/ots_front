<app-header [title]="'Predicciones'"></app-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item *ngFor="let p of predicciones">
      <ion-label>
        <h2>{{ p.modelo_utilizado }}</h2>
        <p>Precisión: {{ p.precision_modelo }}%</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
