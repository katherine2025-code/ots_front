<ion-content>
  <app-sidebar></app-sidebar>
  
  <div class="main-content" id="main-content">
    <ion-header>
      <ion-toolbar color="primary">
        <ion-buttons slot="start">
          <ion-menu-button></ion-menu-button>
        </ion-buttons>
        <ion-title>Mi Perfil</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content class="ion-padding">
      <div class="perfil-container">
        <!-- Foto de Perfil -->
        <div class="foto-perfil-section">
          <div class="foto-container">
            <img [src]="fotoPerfil" alt="Foto de perfil" class="foto-perfil">
            <div class="foto-overlay">
              <label for="file-input" class="btn-cambiar-foto">
                <ion-icon name="camera-outline"></ion-icon>
                <span>Cambiar foto</span>
              </label>
              <input 
                type="file" 
                id="file-input" 
                accept="image/*" 
                (change)="onFileSelected($event)"
                style="display: none">
            </div>
          </div>
          <h3>{{ usuario?.nombres }} {{ usuario?.apellidos }}</h3>
          <p class="rol-badge">{{ rolNombre }}</p>
          
          <div class="foto-actions">
            <ion-button 
              (click)="guardarFoto()" 
              [disabled]="!selectedFile || loading"
              color="primary">
              <ion-icon name="save-outline" slot="start"></ion-icon>
              Guardar Foto
            </ion-button>
            <ion-button 
              (click)="eliminarFoto()" 
              fill="outline"
              color="danger">
              <ion-icon name="trash-outline" slot="start"></ion-icon>
              Eliminar
            </ion-button>
          </div>
        </div>

        <!-- Formulario de Datos -->
        <div class="datos-form-section">
          <h3>Datos Personales</h3>
          <form [formGroup]="perfilForm" class="perfil-form">
            <ion-item>
              <ion-label position="floating">Nombres</ion-label>
              <ion-input formControlName="nombres" type="text"></ion-input>
            </ion-item>

            <ion-item>
              <ion-label position="floating">Apellidos</ion-label>
              <ion-input formControlName="apellidos" type="text"></ion-input>
            </ion-item>

            <ion-item>
              <ion-label position="floating">Correo Electrónico</ion-label>
              <ion-input formControlName="correo" type="email"></ion-input>
            </ion-item>

            <div class="form-actions">
              <ion-button 
                (click)="guardarCambios()" 
                expand="block"
                color="primary">
                <ion-icon name="checkmark-outline" slot="start"></ion-icon>
                Guardar Cambios
              </ion-button>
            </div>
          </form>
        </div>
      </div>
    </ion-content>
  </div>
</ion-content>
