<ion-card [color]="color">
  <ion-card-content>
    <div class="metrica-container">
      <ion-icon [name]="icono" class="metrica-icono"></ion-icon>
      <div class="metrica-info">
        <h3 class="metrica-titulo">{{ titulo }}</h3>
        <p class="metrica-valor">{{ valor }}</p>
      </div>
    </div>
  </ion-card-content>
</ion-card>
