<ion-split-pane contentId="main-content" when="md">
  <!-- MENÚ LATERAL -->
  <ion-menu [contentId]="'main-content'" type="overlay" swipeGesture="true">
    <ion-header>
      <ion-toolbar color="primary">
        <ion-title>
          <div class="menu-header">
            <img src="assets/icon/logo-ots.png" alt="OTS Logo" class="logo-img" (error)="onLogoError($event)">
            <span class="logo-text">OTS</span>
          </div>
        </ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <ion-list>
        <!-- Dashboard -->
        <ion-menu-toggle auto-hide="false">
          <ion-item [routerLink]="['/dashboard']" [class.active]="isActive('/dashboard')" detail="false" lines="none">
            <ion-icon name="grid-outline" slot="start"></ion-icon>
            <ion-label>Dashboard</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <!-- Hoteles - SOLO ADMIN -->
        <ion-menu-toggle auto-hide="false" *ngIf="isAdmin">
          <ion-item [routerLink]="['/hoteles']" [class.active]="isActive('/hoteles')" detail="false" lines="none">
            <ion-icon name="business-outline" slot="start"></ion-icon>
            <ion-label>Hoteles</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <!-- Ocupación - SOLO ADMIN -->
        <ion-menu-toggle auto-hide="false" *ngIf="isAdmin">
          <ion-item [routerLink]="['/ocupacion']" [class.active]="isActive('/ocupacion')" detail="false" lines="none">
            <ion-icon name="people-outline" slot="start"></ion-icon>
            <ion-label>Ocupación</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <!-- Predicciones - ADMIN E INVESTIGADOR -->
        <ion-menu-toggle auto-hide="false" *ngIf="isAdmin || isInvestigador">
          <ion-item [routerLink]="['/predicciones']" [class.active]="isActive('/predicciones')" detail="false"
            lines="none">
            <ion-icon name="analytics-outline" slot="start"></ion-icon>
            <ion-label>Predicciones</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <!-- Reportes - TODOS -->
        <ion-menu-toggle auto-hide="false">
          <ion-item [routerLink]="['/reportes']" [class.active]="isActive('/reportes')" detail="false" lines="none">
            <ion-icon name="document-text-outline" slot="start"></ion-icon>
            <ion-label>Reportes</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <!-- Separador Admin -->
        <ion-item-divider *ngIf="isAdmin">
          <ion-label>Administración</ion-label>
        </ion-item-divider>

        <!-- Usuarios - SOLO ADMIN -->
        <ion-menu-toggle auto-hide="false" *ngIf="isAdmin">
          <ion-item [routerLink]="['/usuarios']" [class.active]="isActive('/usuarios')" detail="false" lines="none">
            <ion-icon name="people-circle-outline" slot="start"></ion-icon>
            <ion-label>Usuarios</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <!-- Encuestas - Admin e Investigador -->
        <ion-menu-toggle auto-hide="false" *ngIf="isAdmin || isInvestigador">
          <ion-item [routerLink]="['/encuestas']" [class.active]="isActive('/encuestas')" detail="false" lines="none">
            <ion-icon name="clipboard-outline" slot="start"></ion-icon>
            <ion-label>Encuestas</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <!-- Carga ETL - SOLO ADMIN -->
        <ion-menu-toggle auto-hide="false" *ngIf="isAdmin">
          <ion-item [routerLink]="['/etl']" [class.active]="isActive('/etl')" detail="false" lines="none">
            <ion-icon name="cloud-upload-outline" slot="start"></ion-icon>
            <ion-label>Carga ETL</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <!-- Separador Investigador -->
        <ion-item-divider *ngIf="isInvestigador && !isAdmin">
          <ion-label>Mi Cuenta</ion-label>
        </ion-item-divider>

        <!-- Mi Perfil - Investigador -->
        <ion-menu-toggle auto-hide="false" *ngIf="isInvestigador">
          <ion-item [routerLink]="['/perfil']" [class.active]="isActive('/perfil')" detail="false" lines="none">
            <ion-icon name="person-outline" slot="start"></ion-icon>
            <ion-label>Mi Perfil</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>

    <!-- Footer con usuario -->
    <ion-footer>
      <ion-toolbar>
        <div class="user-profile">
          <ion-avatar slot="start">
            <img *ngIf="fotoPerfil && fotoCargada" [src]="fotoPerfil" (error)="onImageError($event)">
            <ion-icon *ngIf="!fotoPerfil || !fotoCargada" name="person-circle-outline"></ion-icon>
          </ion-avatar>
          <div class="user-info">
            <span class="user-name">{{ usuario?.nombres }}</span>
            <span class="user-role">{{ rolNombre }}</span>
          </div>
          <ion-button fill="clear" color="danger" (click)="logout()" slot="end">
            <ion-icon name="log-out-outline" slot="icon-only"></ion-icon>
          </ion-button>
        </div>
      </ion-toolbar>
    </ion-footer>
  </ion-menu>

  <!-- CONTENIDO PRINCIPAL -->
  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-split-pane>
