<ion-split-pane contentId="main-content" when="md">
  <!-- MENÚ LATERAL -->
  <ion-menu [contentId]="'main-content'" type="overlay" swipeGesture="true">
    <ion-header class="ion-no-border">
      <div class="menu-header">
        <img src="assets/icon/logo-ots.png" alt="OTS - Observatorio Turístico Sostenible" class="logo-img" (error)="onLogoError($event)">
      </div>
    </ion-header>

    <ion-content>
      <nav aria-label="Menú principal">
        <section class="seccion" *ngFor="let seccion of secciones">
          <h2 class="seccion-titulo" *ngIf="seccion.titulo">{{ seccion.titulo }}</h2>
          <ion-menu-toggle auto-hide="false" *ngFor="let item of seccion.items; trackBy: trackPorRuta">
            <ion-item [routerLink]="item.ruta" routerLinkActive="active" detail="false" lines="none" [title]="item.ayuda">
              <ion-icon [name]="item.icono" slot="start" aria-hidden="true"></ion-icon>
              <ion-label>{{ item.etiqueta }}</ion-label>
            </ion-item>
          </ion-menu-toggle>
        </section>
      </nav>
    </ion-content>

    <!-- Usuario: la tarjeta lleva a "Mi perfil"; el botón de al lado cierra sesión -->
    <ion-footer class="ion-no-border">
      <div class="user-profile">
        <ion-menu-toggle auto-hide="false" class="perfil-toggle">
          <a class="perfil-link" routerLink="/perfil" routerLinkActive="active" title="Ver mi perfil">
            <div class="avatar">
              <img *ngIf="fotoPerfil" [src]="fotoPerfil" alt="" (error)="onImageError()">
              <span *ngIf="!fotoPerfil">{{ iniciales }}</span>
            </div>
            <div class="user-info">
              <span class="user-name">{{ usuario?.nombres }}</span>
              <span class="user-role">{{ rolNombre }}</span>
            </div>
          </a>
        </ion-menu-toggle>
        <button type="button" class="logout-btn" (click)="logout()" aria-label="Cerrar sesión" title="Cerrar sesión">
          <ion-icon name="log-out-outline"></ion-icon>
        </button>
      </div>
    </ion-footer>
  </ion-menu>

  <!-- CONTENIDO PRINCIPAL. En móvil el menú se oculta: la barra superior trae el botón para abrirlo -->
  <div class="ion-page" id="main-content">
    <ion-header class="barra-movil ion-no-border">
      <ion-toolbar>
        <ion-buttons slot="start">
          <ion-menu-button aria-label="Abrir menú"></ion-menu-button>
        </ion-buttons>
        <img src="assets/icon/logo-ots.png" alt="OTS" class="barra-logo">
      </ion-toolbar>
    </ion-header>
    <ion-router-outlet class="contenido"></ion-router-outlet>
  </div>
</ion-split-pane>
