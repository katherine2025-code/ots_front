<ion-app>
  <app-sidebar *ngIf="mostrarSidebar"></app-sidebar>
  <ion-router-outlet *ngIf="!mostrarSidebar"></ion-router-outlet>

  <!-- Botón de tema claro/oscuro: visible en todas las pantallas -->
  <button type="button" class="boton-tema" (click)="theme.alternar()"
    [attr.aria-label]="(theme.temaActual$ | async) === 'oscuro' ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
    [title]="(theme.temaActual$ | async) === 'oscuro' ? 'Tema claro' : 'Tema oscuro'">
    <!-- Luna (se muestra en tema claro: lleva al oscuro) -->
    <svg *ngIf="(theme.temaActual$ | async) !== 'oscuro'" viewBox="0 0 24 24" width="22" height="22" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
    </svg>
    <!-- Sol (se muestra en tema oscuro: lleva al claro) -->
    <svg *ngIf="(theme.temaActual$ | async) === 'oscuro'" viewBox="0 0 24 24" width="22" height="22" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"></circle>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
    </svg>
  </button>
</ion-app>
